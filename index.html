<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タロット占い - 大アルカナ1枚引き</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header>
      <h1 id="resetTitle" style="cursor: pointer;">おとなのタロット占い</h1>
      <div style="height:50px; display: block;"></div>
      <h2>おとなだから悩むのよ</h2>
      <h2>まずは1枚引いてみましょう</h2>
    </header>

    <section class="theme-section" id="themeSection">
      <h2>お題を選んでください</h2>
      <div class="theme-buttons" id="themeButtons">
        <!-- JSで生成 -->
      </div>
    </section>

    <section class="draw-section">
      <div class="card-container" id="cardBackContainer" style="margin-bottom: 24px; cursor: pointer;">
        <img src="images/card_back.jpg" alt="カードの裏面" class="card-image">
      </div>
      <button id="drawButton" class="draw-btn" disabled>カードを引く</button>
    </section>

    <section class="result-section" id="resultSection" style="display: none;">
      <div class="card-container">
        <img id="cardImage" src="" alt="タロットカード" class="card-image">
        <div id="positionBadge" class="position-badge"></div>
      </div>
      <div class="card-info">
        <h2 id="cardName"></h2>
        <p id="cardNameEn" class="card-en"></p>
        <div class="interpretation">
          <h3 id="themeLabel"></h3>
          <p id="interpretationText"></p>
        </div>
      </div>
      <button id="redrawButton" class="draw-btn secondary">最初に戻る</button>
    </section>
  </div>

  <footer style="text-align: center; margin-top: 60px; font-size: 0.9rem; color: #a07882;">
    <a href="privacy.html">プライバシーポリシー</a> ｜ <a href="terms.html">利用規約</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
